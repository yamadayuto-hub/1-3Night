<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1/3夜 投票</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:#f5f5f5;
  margin:0;
  padding:12px;
}
h1{
  text-align:center;
  margin-bottom:16px;
}
.card{
  background:#fff;
  border-radius:12px;
  padding:10px 12px;
  margin-bottom:10px;
  box-shadow:0 1px 4px rgba(0,0,0,.1);
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.name{
  font-weight:600;
  font-size:15px;
}
.address-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:4px;
}
.address{
  font-size:13px;
  color:#000;
}
.icons{
  display:flex;
  gap:8px;
}
.icons img{
  width:18px;
  height:18px;
  display:block;
}
.actions{
  display:flex;
  align-items:center;
  gap:10px;
}
button{
  border:none;
  border-radius:16px;
  padding:6px 16px;
  font-size:13px;
  background:#555;
  color:#fff;
}
button.cancel{
  background:#999;
}
.count{
  font-weight:bold;
  font-size:13px;
}
</style>
</head>

<body>

<h1>🍺1/3夜 投票</h1>
<div id="shops"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyAtMj5B1vPwvNfvRu1UOyPArSao-rHs_Vw",
  authDomain: "night-4be0e.firebaseapp.com",
  projectId: "night-4be0e",
  storageBucket: "night-4be0e.firebasestorage.app",
  messagingSenderId: "128727919874",
  appId: "1:128727919874:web:0798a05e46931df554661b"
});

const db = firebase.firestore();
const KEY = "my_vote_2025";

const SHOPS = [
  {
    id:"kirin",
    name:"きりん",
    address:"〒648-0096 和歌山県橋本市御幸辻１３５−１",
    map:"https://maps.app.goo.gl/mm8BJHzULNYnnMS37?g_st=ic"
  },
  {
    id:"mikura",
    name:"海鮮ダイニング 美蔵 ホテルルートイン橋本店",
    address:"〒648-0073 和歌山県橋本市市脇４丁目１０−２８",
    map:"https://maps.app.goo.gl/2HxXb64kuGyFZfA98?g_st=ic"
  },
  {
    id:"tenma",
    name:"サカナのめしや 天端",
    address:"〒545-0052 大阪府大阪市阿倍野区阿倍野筋１丁目６−１",
    map:"https://maps.app.goo.gl/WYthW7YmEkxJ416M8?g_st=ic",
    insta:"https://www.instagram.com/sakananomeshiya_tenhashi?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw=="
  },
  {
    id:"standfuji",
    name:"スタンドふじ 本店",
    address:"〒545-0052 大阪府大阪市阿倍野区阿倍野筋１丁目５−１",
    map:"https://maps.app.goo.gl/EVydRo8XDyohRy8r7?g_st=ic",
    insta:"https://www.instagram.com/explore/locations/1943103959241819/"
  },
  {
    id:"ajito",
    name:"DINING あじと",
    address:"〒542-0075 大阪府大阪市中央区難波千日前４−２０",
    map:"https://maps.app.goo.gl/BycFBdmiifcyrqmJA?g_st=ic",
    insta:"https://www.instagram.com/dining.ajito?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw=="
  },
  {
    id:"sasaya",
    name:"備長炭やきとり 笹屋",
    address:"〒542-0074 大阪府大阪市中央区千日前１丁目８−１０",
    map:"https://maps.app.goo.gl/yWGcjjNDbmc6Y2pdA?g_st=ic",
    insta:"https://www.instagram.com/explore/locations/124755854870853/sasaya/"
  },
  {
    id:"jutchuhakku",
    name:"みなみの十忠八九",
    address:"〒542-0076 大阪府大阪市中央区難波４丁目２−６",
    map:"https://maps.app.goo.gl/ioRoMH4eQ4NpqqJA7?g_st=ic",
    insta:"https://www.instagram.com/explore/locations/100481826300980/"
  }
];

const votes = {};
const el = document.getElementById("shops");

function vote(id){
  const prev = localStorage.getItem(KEY);

  if(prev === id){
    db.collection("votes").doc(id)
      .set({count:firebase.firestore.FieldValue.increment(-1)}, {merge:true});
    localStorage.removeItem(KEY);
    return;
  }

  if(prev){
    db.collection("votes").doc(prev)
      .set({count:firebase.firestore.FieldValue.increment(-1)}, {merge:true});
  }

  db.collection("votes").doc(id)
    .set({count:firebase.firestore.FieldValue.increment(1)}, {merge:true});
  localStorage.setItem(KEY, id);
}

function render(){
  el.innerHTML = "";

  SHOPS.forEach(s=>{
    const mine = localStorage.getItem(KEY) === s.id;
    const count = votes[s.id] || 0;

    el.insertAdjacentHTML("beforeend",`
      <div class="card">
        <div class="top">
          <div class="name">${s.name}</div>
          <div class="actions">
            <div class="count">${count}票</div>
            <button class="${mine?"cancel":""}" onclick="vote('${s.id}')">
              ${mine ? "取り消す" : "投票する"}
            </button>
          </div>
        </div>

        <div class="address-row">
          <div class="address">${s.address}</div>
          <div class="icons">
            <a href="${s.map}" target="_blank">
              <img src="google-maps-new.png" alt="Google Maps">
            </a>
            ${s.insta ? `
              <a href="${s.insta}" target="_blank">
                <img src="instagram.png" alt="Instagram">
              </a>` : ""}
          </div>
        </div>
      </div>
    `);
  });
}

db.collection("votes").onSnapshot(snap=>{
  snap.forEach(doc=>{
    votes[doc.id] = doc.data().count || 0;
  });
  render();
});
</script>

</body>
</html>
