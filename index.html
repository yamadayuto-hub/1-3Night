<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>25年忘年会 投票</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:#f5f5f5;
  margin:0;
  padding:12px;
}
h1{
  text-align:center;
  margin-bottom:16px;
}
.card{
  background:#fff;
  border-radius:12px;
  padding:10px 12px;
  margin-bottom:10px;
  box-shadow:0 1px 4px rgba(0,0,0,.1);
}

/* ▼ 上段（店名 + 投票） */
.top{
  display:flex;
  align-items:flex-start;
  gap:10px;
}
.name{
  font-weight:600;
  font-size:15px;
  line-height:1.35;
  flex:1;                 /* ← 店名側だけ伸縮 */
}

/* ▼ 右側は固定 */
.actions{
  display:flex;
  align-items:center;
  gap:10px;
  flex-shrink:0;           /* ← 絶対に潰れない */
  white-space:nowrap;      /* ← 1行固定 */
}
.count{
  font-weight:bold;
  font-size:13px;
}
button{
  border:none;
  border-radius:18px;
  padding:7px 18px;
  font-size:13px;
  background:#f0b429;
  color:#222;
  font-weight:600;
}
button.cancel{
  background:#ddd;
  color:#555;
}

/* ▼ 住所行 */
.address-row{
  display:flex;
  align-items:center;
  margin-top:6px;
}
.address{
  font-size:13px;
  color:#000;
  line-height:1.4;
}

/* ▼ アイコン列（常に2枠確保） */
.icons{
  margin-left:auto;
  display:grid;
  grid-template-columns:18px 18px;
  gap:10px;
}
.icons img{
  width:18px;
  height:18px;
  display:block;
}
.icons .placeholder{
  width:18px;
  height:18px;
}
</style>
</head>

<body>

<h1>🍺 25年忘年会 投票</h1>
<div id="shops"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyAtMj5B1vPwvNfvRu1UOyPArSao-rHs_Vw",
  authDomain: "night-4be0e.firebaseapp.com",
  projectId: "night-4be0e",
  storageBucket: "night-4be0e.firebasestorage.app",
  messagingSenderId: "128727919874",
  appId: "1:128727919874:web:0798a05e46931df554661b"
});

const db = firebase.firestore();
const KEY = "my_vote_2025";

const SHOPS = [
  { id:"kirin", name:"きりん", address:"〒648-0096 和歌山県橋本市御幸辻１３５−１", map:"https://maps.app.goo.gl/mm8BJHzULNYnnMS37?g_st=ic" },
  { id:"mikura", name:"海鮮ダイニング 美蔵 ホテルルートイン橋本店", address:"〒648-0073 和歌山県橋本市市脇４丁目１０−２８", map:"https://maps.app.goo.gl/2HxXb64kuGyFZfA98?g_st=ic" },
  { id:"tenma", name:"サカナのめしや 天端", address:"〒545-0052 大阪府大阪市阿倍野区阿倍野筋１丁目６−１", map:"https://maps.app.goo.gl/WYthW7YmEkxJ416M8?g_st=ic", insta:"https://www.instagram.com/sakananomeshiya_tenhashi" },
  { id:"standfuji", name:"スタンドふじ 本店", address:"〒545-0052 大阪府大阪市阿倍野区阿倍野筋１丁目５−１", map:"https://maps.app.goo.gl/EVydRo8XDyohRy8r7?g_st=ic", insta:"https://www.instagram.com/explore/locations/1943103959241819/" },
  { id:"ajito", name:"DINING あじと", address:"〒542-0075 大阪府大阪市中央区難波千日前４−２０", map:"https://maps.app.goo.gl/BycFBdmiifcyrqmJA?g_st=ic", insta:"https://www.instagram.com/dining.ajito" },
  { id:"sasaya", name:"備長炭やきとり 笹屋", address:"〒542-0074 大阪府大阪市中央区千日前１丁目８−１０", map:"https://maps.app.goo.gl/yWGcjjNDbmc6Y2pdA?g_st=ic", insta:"https://www.instagram.com/explore/locations/124755854870853/sasaya/" },
  { id:"jutchuhakku", name:"みなみの十忠八九", address:"〒542-0076 大阪府大阪市中央区難波４丁目２−６", map:"https://maps.app.goo.gl/ioRoMH4eQ4NpqqJA7?g_st=ic", insta:"https://www.instagram.com/explore/locations/100481826300980/" }
];

const votes = {};
const el = document.getElementById("shops");

function vote(id){
  const prev = localStorage.getItem(KEY);
  if(prev === id){
    db.collection("votes").doc(id)
      .set({count:firebase.firestore.FieldValue.increment(-1)}, {merge:true});
    localStorage.removeItem(KEY);
    return;
  }
  if(prev){
    db.collection("votes").doc(prev)
      .set({count:firebase.firestore.FieldValue.increment(-1)}, {merge:true});
  }
  db.collection("votes").doc(id)
    .set({count:firebase.firestore.FieldValue.increment(1)}, {merge:true});
  localStorage.setItem(KEY, id);
}

function render(){
  const list = SHOPS.map(s=>({...s, count:votes[s.id]||0}));
  const max = Math.max(...list.map(s=>s.count),0);
  list.sort((a,b)=>b.count-a.count);

  el.innerHTML = "";
  list.forEach(s=>{
    const mine = localStorage.getItem(KEY) === s.id;
    const crown = s.count === max && max > 0 ? " 👑" : "";

    el.insertAdjacentHTML("beforeend",`
      <div class="card">
        <div class="top">
          <div class="name">${s.name}${crown}</div>
          <div class="actions">
            <div class="count">${s.count}票</div>
            <button class="${mine?"cancel":""}" onclick="vote('${s.id}')">
              ${mine ? "取り消す" : "投票する"}
            </button>
          </div>
        </div>

        <div class="address-row">
          <div class="address">${s.address}</div>
          <div class="icons">
            <a href="${s.map}" target="_blank">
              <img src="google-maps-new.png">
            </a>
            ${s.insta
              ? `<a href="${s.insta}" target="_blank"><img src="instagram.png"></a>`
              : `<div class="placeholder"></div>`
            }
          </div>
        </div>
      </div>
    `);
  });
}

db.collection("votes").onSnapshot(snap=>{
  snap.forEach(doc=>votes[doc.id]=doc.data().count||0);
  render();
});
</script>

</body>
</html>
