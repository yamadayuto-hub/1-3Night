<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>25年忘年会 投票</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont;
  margin:0;
  padding:16px;
  background:#fafafa;
}
h2{margin-top:40px;}
.card{
  background:#fff;
  border-radius:12px;
  padding:12px;
  margin-bottom:20px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}
.vote{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:8px;
}
button{
  padding:10px 16px;
  border:none;
  border-radius:20px;
  background:#000;
  color:#fff;
  font-size:14px;
}
.count{
  font-size:14px;
}
iframe{
  width:100%;
  height:220px;
  border:0;
  border-radius:10px;
}
</style>
</head>

<body>

<h1>🍻 25年忘年会 店投票</h1>

<h2>🔵 橋本</h2>

<div class="card" data-shop="kirin">
  <h3>きりん</h3>
  <iframe src="【ここにGoogleマップ埋め込みURL】"></iframe>
  <div class="vote">
    <button onclick="vote('kirin')">👍 投票</button>
    <span class="count" id="kirin">0 票</span>
  </div>
</div>

<div class="card" data-shop="mikura">
  <h3>美蔵</h3>
  <iframe src="【MAP】"></iframe>
  <div class="vote">
    <button onclick="vote('mikura')">👍 投票</button>
    <span class="count" id="mikura">0 票</span>
  </div>
</div>

<div class="card" data-shop="kakiemon">
  <h3>柿右エ門</h3>
  <iframe src="【MAP】"></iframe>
  <div class="vote">
    <button onclick="vote('kakiemon')">👍 投票</button>
    <span class="count" id="kakiemon">0 票</span>
  </div>
</div>

<div class="card" data-shop="shimakura">
  <h3>BAR SHIMAKURA</h3>
  <iframe src="【MAP】"></iframe>
  <div class="vote">
    <button onclick="vote('shimakura')">👍 投票</button>
    <span class="count" id="shimakura">0 票</span>
  </div>
</div>

<h2>🔴 大阪</h2>

<div class="card" data-shop="jutchuhakku">
  <h3>十忠八九</h3>
  <iframe src="【MAP】"></iframe>
  <div class="vote">
    <button onclick="vote('jutchuhakku')">👍 投票</button>
    <span class="count" id="jutchuhakku">0 票</span>
  </div>
</div>

<div class="card" data-shop="hachimaru">
  <h3>ハチマル蒲鉾</h3>
  <iframe src="【MAP】"></iframe>
  <div class="vote">
    <button onclick="vote('hachimaru')">👍 投票</button>
    <span class="count" id="hachimaru">0 票</span>
  </div>
</div>

<div class="card" data-shop="sasaya">
  <h3>笹屋</h3>
  <iframe src="【MAP】"></iframe>
  <div class="vote">
    <button onclick="vote('sasaya')">👍 投票</button>
    <span class="count" id="sasaya">0 票</span>
  </div>
</div>

<div class="card" data-shop="ajito">
  <h3>DINING あじと</h3>
  <iframe src="【MAP】"></iframe>
  <div class="vote">
    <button onclick="vote('ajito')">👍 投票</button>
    <span class="count" id="ajito">0 票</span>
  </div>
</div>

<script>
// 🔥 Firebase 設定（ここ差し替え）
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT_ID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 初期化
const shops = [
  "kirin","mikura","kakiemon","shimakura",
  "jutchuhakku","hachimaru","sasaya","ajito"
];

// リアルタイム反映
shops.forEach(id=>{
  db.collection("votes").doc(id).onSnapshot(doc=>{
    const v = doc.exists ? doc.data().count : 0;
    document.getElementById(id).textContent = v + " 票";
  });
});

// 投票
function vote(shop){
  const ref = db.collection("votes").doc(shop);
  ref.set({count:firebase.firestore.FieldValue.increment(1)}, {merge:true});
}
</script>

</body>
</html>
