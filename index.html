<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>25年忘年会 投票</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:#f5f5f5;
  margin:0;
  padding:12px;
}
h1{
  text-align:center;
  margin-bottom:16px;
}
.card{
  background:#fff;
  border-radius:12px;
  padding:10px 12px;
  margin-bottom:10px;
  box-shadow:0 1px 4px rgba(0,0,0,.1);
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.name{
  font-weight:600;
  font-size:15px;
}
.address{
  font-size:13px;
  color:#000;
  margin-top:4px;
}
.actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:8px;
}
.left-actions{
  display:flex;
  gap:8px;
}
a.map-link{
  font-size:13px;
  padding:6px 12px;
  border-radius:16px;
  background:#eee;
  color:#000;
  text-decoration:none;
}
button{
  border:none;
  border-radius:16px;
  padding:6px 14px;
  font-size:13px;
  background:#007aff;
  color:#fff;
}
button.cancel{
  background:#999;
}
.count{
  font-weight:bold;
  font-size:13px;
}
</style>
</head>

<body>

<h1>🍺 25年忘年会 投票</h1>
<div id="shops"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyAtMj5B1vPwvNfvRu1UOyPArSao-rHs_Vw",
  authDomain: "night-4be0e.firebaseapp.com",
  projectId: "night-4be0e",
  storageBucket: "night-4be0e.firebasestorage.app",
  messagingSenderId: "128727919874",
  appId: "1:128727919874:web:0798a05e46931df554661b"
});

const db = firebase.firestore();
const KEY = "my_vote_2025";

const SHOPS = [
  {
    id:"kirin",
    area:"橋本",
    name:"きりん",
    address:"〒648-0096 和歌山県橋本市御幸辻１３５−１",
    map:"https://maps.app.goo.gl/mm8BJHzULNYnnMS37?g_st=ic"
  },
  {
    id:"mikura",
    area:"橋本",
    name:"海鮮ダイニング 美蔵 ホテルルートイン橋本店",
    address:"〒648-0073 和歌山県橋本市市脇４丁目１０−２８",
    map:"https://maps.app.goo.gl/2HxXb64kuGyFZfA98?g_st=ic"
  },
  {
    id:"tenma",
    area:"大阪",
    name:"サカナのめしや 天端",
    address:"〒545-0052 大阪府大阪市阿倍野区阿倍野筋１丁目６−１ ヴィアあべのウォーク 1F 121",
    map:"https://maps.app.goo.gl/WYthW7YmEkxJ416M8?g_st=ic"
  },
  {
    id:"standfuji",
    area:"大阪",
    name:"スタンドふじ 本店",
    address:"〒545-0052 大阪府大阪市阿倍野区阿倍野筋１丁目５−１ ルシアスビル B１F",
    map:"https://maps.app.goo.gl/EVydRo8XDyohRy8r7?g_st=ic"
  },
  {
    id:"ajito",
    area:"大阪",
    name:"DINING あじと",
    address:"〒542-0075 大阪府大阪市中央区難波千日前４−２０",
    map:"https://maps.app.goo.gl/BycFBdmiifcyrqmJA?g_st=ic"
  },
  {
    id:"sasaya",
    area:"大阪",
    name:"備長炭やきとり 笹屋",
    address:"〒542-0074 大阪府大阪市中央区千日前１丁目８−１０",
    map:"https://maps.app.goo.gl/yWGcjjNDbmc6Y2pdA?g_st=ic"
  },
  {
    id:"jutchuhakku",
    area:"大阪",
    name:"みなみの十忠八九",
    address:"〒542-0076 大阪府大阪市中央区難波４丁目２−６ トシヒサビル 1F・2F",
    map:"https://maps.app.goo.gl/ioRoMH4eQ4NpqqJA7?g_st=ic"
  }
];

const votes = {};
const el = document.getElementById("shops");

function vote(id){
  const prev = localStorage.getItem(KEY);

  if(prev === id){
    db.collection("votes").doc(id)
      .set({count:firebase.firestore.FieldValue.increment(-1)}, {merge:true});
    localStorage.removeItem(KEY);
    return;
  }

  if(prev){
    db.collection("votes").doc(prev)
      .set({count:firebase.firestore.FieldValue.increment(-1)}, {merge:true});
  }

  db.collection("votes").doc(id)
    .set({count:firebase.firestore.FieldValue.increment(1)}, {merge:true});
  localStorage.setItem(KEY, id);
}

function render(){
  const list = SHOPS.map(s=>({...s, count:votes[s.id]||0}));
  const max = Math.max(...list.map(s=>s.count),0);

  const top = list.filter(s=>s.count===max && max>0);
  const rest = list.filter(s=>s.count!==max || max===0);

  rest.sort((a,b)=>a.area.localeCompare(b.area,"ja"));

  el.innerHTML = "";

  [...top, ...rest].forEach(s=>{
    const mine = localStorage.getItem(KEY) === s.id;

    el.insertAdjacentHTML("beforeend",`
      <div class="card">
        <div class="top">
          <div class="name">${s.name}${s.count===max && max>0 ? " 👑" : ""}</div>
        </div>

        <div class="address">${s.address}</div>

        <div class="actions">
          <div class="left-actions">
            <a class="map-link" href="${s.map}" target="_blank">Googleマップで開く</a>
            <button class="${mine?"cancel":""}" onclick="vote('${s.id}')">
              ${mine ? "取り消す" : "👍 投票する"}
            </button>
          </div>
          <div class="count">${s.count}票</div>
        </div>
      </div>
    `);
  });
}

db.collection("votes").onSnapshot(snap=>{
  snap.forEach(doc=>{
    votes[doc.id] = doc.data().count || 0;
  });
  render();
});
</script>

</body>
</html>
